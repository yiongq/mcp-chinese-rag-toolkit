# Multi-config benchmark eval set — the CI smoke set (eval-set.yml) PLUS a
# hard tier of colloquial paraphrase queries with near-zero lexical overlap
# PLUS an aggregation tier of entity-scatter queries, all against the 18-chunk
# bench fixture (12 CI-mirrored chunks + 6 benchmark-only aggregation chunks,
# see bin/run-benchmark.ts#FIXTURE_CHUNKS). Each tier isolates one mechanism:
# the hard tier differentiates BM25 vs embeddings (shared tokens vs semantics);
# the aggregation tier isolates the graph third source (entity_mentions reach
# alias-only pages that neither BM25 nor the embedding can bridge).
#
# Used by bin/run-benchmark.ts ONLY. The CI gate (bin/run-eval.ts) keeps using
# eval-set.yml — hard queries here must NOT tighten the CI threshold.
#
# When adding queries: every new query MUST have a leading `# reason:` comment
# (same ruling as eval-set.yml).

version: v3-hr-bench-agg-mix
description: |
  28-query benchmark set over the 18-chunk bench fixture: the 12 CI smoke
  queries (easy tier, keyword-adjacent) + 12 paraphrase queries (hard tier,
  near-zero lexical overlap) + 4 entity-aggregation queries (aggregation
  tier) whose evidence is scattered across pages 14-18 and mentions the
  entity only by alias (TRS / 工号 A1024, bound by the p13 anchor) — the
  tier that isolates the graph third source. Retrieval-only; answer metrics
  stay out until the faithfulness judge passes calibration.

queries:
  # ── easy tier: verbatim copy of eval-set.yml（基础题，四配置都应命中）──

  # reason: 直接命中"差旅报销"主关键词，验证 BM25 路径基础功能
  - query: 差旅报销需要保留什么凭证
    category: leave-policy
    expected:
      - source: bench-fixture.md
        page: 1

  # reason: 同义改写——查询用"实习"chunk 用"实习期评估"——验证 jieba 中文分词
  - query: 实习期评估怎么做
    category: onboarding
    expected:
      - source: bench-fixture.md
        page: 2

  # reason: 试用期是 HR 高频咨询问题，标志性 BDD 查询
  - query: 试用期多久
    category: probation
    expected:
      - source: bench-fixture.md
        page: 3

  # reason: 验证"培训计划"语义检索，BGE embedding 不依赖关键词全匹配
  - query: 员工培训怎么安排
    category: training
    expected:
      - source: bench-fixture.md
        page: 4

  # reason: 短 query"请假"+流程类问句，覆盖典型 HR 短问句场景
  - query: 请假怎么申请
    category: leave-policy
    expected:
      - source: bench-fixture.md
        page: 5

  # reason: 复合语义（加班+换算+工资），验证 reranker 在多概念 query 上的排序
  - query: 加班可以换调休吗
    category: compensation
    expected:
      - source: bench-fixture.md
        page: 6

  # reason: 节假日是 HR 高频咨询；验证"国家公历"等不常见词汇召回
  - query: 法定节假日怎么安排
    category: holidays
    expected:
      - source: bench-fixture.md
        page: 7

  # reason: 保密协议——专有名词类 query，验证 BGE 对术语的 embedding 准确度
  - query: 保密协议覆盖哪些内容
    category: compliance
    expected:
      - source: bench-fixture.md
        page: 8

  # reason: 年终奖发放规则——经典 HR 问题，验证 RRF 融合在数字相关 query 上效果
  - query: 年终奖怎么发
    category: compensation
    expected:
      - source: bench-fixture.md
        page: 9

  # reason: 体检福利——验证短 query + 实体类（"体检"）的召回稳定性
  - query: 体检每年几次
    category: benefits
    expected:
      - source: bench-fixture.md
        page: 10

  # reason: 离职流程——验证 hybrid search 在程序类 query 上的表现
  - query: 离职手续怎么办
    category: offboarding
    expected:
      - source: bench-fixture.md
        page: 11

  # reason: 长 query（含限定条件"出差预订机票"）——验证 reranker 对长 query 的差异化排序
  - query: 出差预订机票有什么要求
    category: travel
    expected:
      - source: bench-fixture.md
        page: 12

  # ── hard tier: 口语改述，词面近零重叠（打 BM25 软肋，区分四配置）──

  # reason: 报销的口语改述（"垫付的钱要回来"），且"出差"是 page 12 的词面陷阱——考排序
  - query: 出差回来怎么把垫付的钱要回来
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 1

  # reason: "见习/考核" vs "实习/评估"——同义不同词，BM25 零命中信号
  - query: 见习期结束会有什么考核
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 2

  # reason: "成为正式员工" vs "转正"——语义等价词面不同
  - query: 刚入职的新人多久能成为正式员工
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 3

  # reason: "学新技能" vs "培训"——上下位语义关联，纯语义题
  - query: 想学点新技能公司有什么安排
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 4

  # reason: "休两天假" vs "请假"——jieba 分词后无公共 token，考语义
  - query: 想休两天假该走什么流程
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 5

  # reason: "工作日之外干活/换休息" vs "加班/调休"——全同义改写零重叠
  - query: 工作日之外干活能换休息吗
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 6

  # reason: "过年过节放假" vs "法定节假日"——口语节庆表达
  - query: 过年过节公司放不放假
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 7

  # reason: "商业机密" vs "保密协议/客户资料"——近义术语替换
  - query: 公司的商业机密范围包括什么
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 8

  # reason: "奖金取决于什么" vs "年终奖/绩效/挂钩"——避开全部原词
  - query: 发多少奖金取决于什么
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 9

  # reason: "身体检查" vs "健康体检"——近义复合词拆分，BM25 难命中
  - query: 公司提供身体检查福利吗
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 10

  # reason: "辞职/步骤" vs "离职/手续"——同义替换零重叠
  - query: 辞职要走哪些步骤
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 11

  # reason: "住宿和交通/省钱" vs "机票酒店/折扣"——全语义映射，考 embedding 泛化
  - query: 住宿和交通怎么订更省钱
    category: hard-paraphrase
    expected:
      - source: bench-fixture.md
        page: 12

  # ── aggregation tier: 实体聚合题（证据分散在 p14-18，正文只以别名提及实体；
  #    锚点 p13 建立别名映射，本身是词面磁铁但不含答案事实，刻意不进 expected。
  #    评分是任一 expected 页命中即 hit（见 expectedMatches），因此 expected 全部
  #    选两路检索都够不着的别名页——「捞得全」由 run-benchmark 的 coverage@5 度量）──

  # reason: 系统聚合题——p14/15/18 只写 "TRS"，与查询零词面重叠且语义冷；仅图谱 mention 展开可达
  - query: 差旅报销系统最近有哪些调整和通知
    category: aggregation
    expected:
      - source: bench-fixture.md
        page: 14
      - source: bench-fixture.md
        page: 15
      - source: bench-fixture.md
        page: 18

  # reason: 系统聚合题改述——"变更"限定排除锚点 p13（职责说明不含变更事实），expected 收敛到两页
  - query: 差旅报销系统今年发布过哪些变更
    category: aggregation
    expected:
      - source: bench-fixture.md
        page: 14
      - source: bench-fixture.md
        page: 15

  # reason: 人物聚合题——p16/17/18 只写 "工号 A1024"，BM25 无 "张伟" token、向量无表面桥接
  - query: 张伟负责的工作内容都有哪些
    category: aggregation
    expected:
      - source: bench-fixture.md
        page: 16
      - source: bench-fixture.md
        page: 17
      - source: bench-fixture.md
        page: 18

  # reason: 人物聚合题口语改述——"手头的事"考实体名 + 口语组合下第三路的稳健性
  - query: 张伟手头都有什么事
    category: aggregation
    expected:
      - source: bench-fixture.md
        page: 16
      - source: bench-fixture.md
        page: 17
      - source: bench-fixture.md
        page: 18
